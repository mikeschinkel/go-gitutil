# Generated by 'gomion repo workflows'; do not edit.
# Regenerate with 'gomion repo setup' or 'gomion repo workflows'.
name: Test

# A push or pull request that changes only Endless's own files under .endless/
# skips CI, which never reads them
on:
  push:
    branches: [ main, dev ]
    paths-ignore: [ '.endless/**' ]
  pull_request:
    branches: [ main, dev ]
    paths-ignore: [ '.endless/**' ]

env:
  GO_VERSION: '1.27'
  # Build against each go.mod's requires, never a local go.work, so an
  # unpublished dependency fails here
  GOWORK: 'off'

jobs:
  # Every library, executable and test module, each in its own job
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        dir: [ '.', 'test' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: go test -v -race ./...

  # Every go.mod must be tidy as committed; CI checks, it does not tidy for you
  tidy:
    name: go.mod Tidy
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Check every module is tidy
        run: |
          status=0
          for dir in . test; do
            echo "Checking $dir..."
            if ! (cd "$dir" && go mod tidy -diff); then
              echo "::error file=$dir/go.mod::$dir is not tidy; run 'go mod tidy' there"
              status=1
            fi
          done
          exit $status

  # Lint and static analysis, in every library and executable module
  lint:
    name: Lint (${{ matrix.dir }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        dir: [ '.' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.dir }}
          args: --timeout=5m
