# ── DO NOT EDIT ─────────────────────────────────────────────────────
# This suite belongs to E-2529 and records what was true when E-2529
# landed. Edit it only if you ARE E-2529. If your change breaks a check
# here, leave it alone — see .endless/tasks/CLAUDE.md.
schema = 1
task   = "E-2529"

[[check]]
name   = "test/ module tests"
runner = "gotest"
dir    = "test"
paths  = ["./..."]

[[check]]
name   = "root module tests"
runner = "gotest"
paths  = ["./..."]

[[check]]
name = "both modules build, vet, race-test and are tidy without go.work"
sh   = "GOWORK=off go build ./... && GOWORK=off go vet ./... && GOWORK=off go mod tidy -diff && GOWORK=off go test -race -count=1 ./... >/dev/null && cd test && GOWORK=off go vet ./... && GOWORK=off go mod tidy -diff && GOWORK=off go test -race -count=1 ./... >/dev/null"

[[check]]
name         = "both modules lint clean with golangci-lint v2.15+"
sh           = "golangci-lint version 2>&1 && GOWORK=off golangci-lint run ./... 2>&1 && cd test && GOWORK=off golangci-lint run ./... 2>&1"
not_contains = "issues:"

[[check]]
name = "root go.mod requires published versions and has no replace; every go.mod says go 1.27.0"
sh   = "grep -q 'go-diffutils v0.1.0$' go.mod && grep -q 'go-dt v0.7.2$' go.mod && grep -q 'go-dt/dtx v0.3.0$' go.mod && ! grep -q '^replace' go.mod && grep -qx 'go 1.27.0' go.mod && grep -qx 'go 1.27.0' test/go.mod"

[[check]]
name = "README covers install, NewRepo, Open, RepoArgs and Strict mode"
sh   = "grep -q 'go get github.com/mikeschinkel/go-gitutil' README.md && grep -q 'gitutil.NewRepo(' README.md && grep -q 'gitutil.Open(' README.md && grep -q 'gitutil.RepoArgs' README.md && grep -q '### Strict mode' README.md"

[[check]]
name = "README's example compiles against this module"
sh   = "d=$(mktemp -d) && awk '/^```go$/{f=1;next}/^```$/{f=0}f' README.md > $d/main.go && printf 'module ex\\n\\ngo 1.27.0\\n\\nrequire (\\n\\tgithub.com/mikeschinkel/go-gitutil v0.0.0\\n\\tgithub.com/mikeschinkel/go-dt v0.7.2\\n)\\n\\nreplace github.com/mikeschinkel/go-gitutil => %s\\n' \"$PWD\" > $d/go.mod && (cd $d && GOWORK=off GOFLAGS=-mod=mod go build -o /dev/null .); s=$?; rm -rf $d; exit $s"

[[check]]
name = "PLAN-CONDENSED-DIFF-TYPES.md is gone"
sh   = "test ! -e PLAN-CONDENSED-DIFF-TYPES.md"

[[check]]
name = "workflows are generated, not hand-written, and release notes leave out .endless"
sh   = "head -1 .github/workflows/test.yml | grep -q \"Generated by 'gomion repo workflows'\" && head -1 .github/workflows/release.yml | grep -q \"Generated by 'gomion repo workflows'\" && grep -q \"':(exclude).endless'\" .github/workflows/release.yml"

[[check]]
name   = "the repo has no tags"
sh     = "git tag -l"
equals = ""
