# Plan items for E-2600: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2600 --items-file <copy>

[[item]]
id = "P33"
kind = "deliverable"
statement = "The package is named gitutil, requires go-dt v0.7.2, every go.mod says go 1.27.0, and every module lints clean with golangci-lint v2.15.0"
verify = "go doc . | head -1; grep go-dt go.mod; golangci-lint run ./..."

[[item]]
id = "P34"
kind = "deliverable"
statement = "go-gitutil's own GitRef and RemoteName types are gone; branch names, revisions, tags, remotes and RevParse's result use go-dt's git types"

[[item]]
id = "P35"
kind = "deliverable"
statement = "The current remote is read from git config branch.<branch>.remote and branch.<branch>.merge, with no split on '/'"
verify = "test/ covers a remote and a branch whose names contain '/'"

[[item]]
id = "P36"
kind = "deliverable"
statement = "Every git process runs through one unexported run function; Streamer, GitRunner.runGit's separate path and OpenRepo's raw exec.Command are gone"

[[item]]
id = "P37"
kind = "deliverable"
statement = "Repo.Run(ctx, gitArgs ...string) runs any git command with the Repo's settings"

[[item]]
id = "P38"
kind = "deliverable"
statement = "NewRepo(dir, *RepoArgs) builds a Repo without running git; (*Repo).Open(ctx, *OpenArgs) replaces OpenRepo, which is removed"

[[item]]
id = "P39"
kind = "deliverable"
statement = "RepoArgs holds StdIO, Env, GitPath and Strict, and has no Identity field"

[[item]]
id = "P40"
kind = "deliverable"
statement = "A method's non-zero embedded RepoArgs combines with the Repo's for that call: StdIO and GitPath replace when set, Env entries follow the Repo's, and Strict true turns isolation on but false cannot turn it off"
verify = "test/ covers each of the four rules"

[[item]]
id = "P41"
kind = "deliverable"
statement = "With Strict, git runs with an environment built from nothing: an empty HOME, GIT_CONFIG_GLOBAL=/dev/null, GIT_CONFIG_NOSYSTEM=1, GIT_ALLOW_PROTOCOL=file, GIT_TERMINAL_PROMPT=0, then RepoArgs.Env, plus -c user.useConfigOnly=true"
verify = "test/ sets a hostile HOME, GIT_DIR and GIT_AUTHOR_NAME and shows none reaches git; an https clone fails; a commit with no identity fails"

[[item]]
id = "P42"
kind = "deliverable"
statement = "Strict with an empty GitPath fails before running git"

[[item]]
id = "P43"
kind = "deliverable"
statement = "Init exists as a Repo method and as gitutil.Init(ctx, dir, *InitArgs) returning a *Repo; InitArgs embeds RepoArgs and has Branch, Identity and Config"

[[item]]
id = "P44"
kind = "deliverable"
statement = "Clone exists as a Repo method and as gitutil.Clone(ctx, src, dir, *CloneArgs) returning a *Repo; CloneArgs embeds RepoArgs and has Local, NoCheckout, Bare, Branch, Identity and Config, with Config passed as git clone -c"

[[item]]
id = "P45"
kind = "deliverable"
statement = "Package-level Open, Init and Clone return a Repo that keeps the embedded RepoArgs"

[[item]]
id = "P46"
kind = "deliverable"
statement = "An Identity writes user.name and user.email into the new repo's local config, and Config keys are written in sorted order"

[[item]]
id = "P47"
kind = "deliverable"
statement = "Repo.SetConfig and Repo.GetConfig write and read the repo's local config"

[[item]]
id = "P48"
kind = "deliverable"
statement = "Repo.Add takes AddArgs with Paths, Exclude, All and Force, and each Exclude entry becomes a :(exclude)<dir>/ pathspec"

[[item]]
id = "P49"
kind = "deliverable"
statement = "Repo.Commit takes CommitArgs with Message, Author, Committer, AuthorDate, CommitterDate and AllowEmpty; the identity and date fields are pointers"

[[item]]
id = "P50"
kind = "deliverable"
statement = "A nil Committer uses Author, a nil CommitterDate uses AuthorDate, a nil Author lets git resolve it, and a nil AuthorDate lets git use the current time"
verify = "test/ commits twice with fixed Author and AuthorDate only and gets the same hash both times"

[[item]]
id = "P51"
kind = "deliverable"
statement = "An Identity, Author or Committer with an empty DisplayName is refused before git runs"

[[item]]
id = "P52"
kind = "deliverable"
statement = "Streamer, StageModuleFiles and the package-level Commit and UnstageAll are deleted; UnstageAll and StageFileContent remain as Repo methods"

[[item]]
id = "P53"
kind = "deliverable"
statement = "Methods that read the current branch or its upstream return an error on an unopened Repo; all other methods run without Open, and each method's doc comment says whether it needs Open"

[[item]]
id = "P54"
kind = "deliverable"
statement = "Status, StageFiles, StageFileContent, IgnoredFiles, LsFilesRaw, UnstageFiles, ExportStagedFiles, FindRepoRoot and InfoDir are Repo methods, and each package-level form wraps its method and takes one Args type embedding RepoArgs, last"

[[item]]
id = "P55"
kind = "deliverable"
statement = "AddWorktreeArgs has Path dt.DirPath, Branch dt.GitBranchName, Base dt.GitRevision, Force and ReuseBranch; with ReuseBranch and an existing branch, AddWorktree checks it out, otherwise it creates the branch with -b"

[[item]]
id = "P56"
kind = "deliverable"
statement = "Repo.CommitCount(ctx, dt.GitRevision) returns the number of commits reachable from the revision"

[[item]]
id = "P57"
kind = "deliverable"
statement = "Repo.TreeEntry(ctx, dt.GitRevision, dt.RelFilepath) returns a TreeEntry with mode, object type, dt.GitObjectID and path, and a nested repo added with Force reads as mode 160000"

[[item]]
id = "P58"
kind = "deliverable"
statement = "cached_worktree.go clones through Clone"

[[item]]
id = "P59"
kind = "exclusion"
statement = "Does not choose a git binary by version; RepoArgs takes only a path (go-binaries owns version constraints)"

[[item]]
id = "P60"
kind = "exclusion"
statement = "Does not support credentials or network remotes in strict mode"

[[item]]
id = "P61"
kind = "exclusion"
statement = "Does not move FindNestedModules to go-goutil"

[[item]]
id = "P62"
kind = "exclusion"
statement = "Does not change go-fsfix, gomion or endless"

[[item]]
id = "P63"
kind = "exclusion"
statement = "Does not tag or release go-gitutil"

[[item]]
id = "P64"
kind = "exclusion"
statement = "Does not move diff_parser_test.go into the test/ module"
