# Plan items for E-2624: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2624 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "go-gitutil exports CommitSignal with CommitSignalNone, CommitSignalFix, CommitSignalFeat and CommitSignalBreaking, and CommitClassifier func(subject, body string) CommitSignal"

[[item]]
id = "P2"
kind = "deliverable"
statement = "ConventionalCommitSignal(subject, body) returns breaking when the subject carries ! before the colon or the body has a breaking-change footer, otherwise feat for a feat type, fix for a fix type, and none for anything else"
verify = "test/ module: feat:, feat(api):, feat!:, refactor(x)!:, Fix:, a body footer, docs:, and a subject with no type"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A breaking-change footer is a body line that starts with BREAKING CHANGE: or BREAKING-CHANGE: in uppercase; the phrase elsewhere in a line, or in another case, is not one"
verify = "test/ module: a body that mentions the phrase mid-line classifies as not breaking"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Conventional commit types match case-insensitively"
verify = "test/ module: Feat: classifies as feat and parses with Type Feat"

[[item]]
id = "P5"
kind = "deliverable"
statement = "SummarizeCommitSignals(entries []CommitLogEntry, classify CommitClassifier) CommitSignals counts Breaking, Feat, Fix and Total and sets Highest by breaking > feat > fix; nil classify means ConventionalCommitSignal"
verify = "test/ module: no entries, mixed entries, and a custom classifier"

[[item]]
id = "P6"
kind = "deliverable"
statement = "ParseConventionalCommit(subject) (ConventionalCommit, bool) splits a subject of the form type(scope)!: description into Type, Scope, Breaking and Description, and reports false when the subject has no type"
verify = "test/ module: with and without scope and !, and subjects such as Merge branch 'x' that have no type"

[[item]]
id = "P7"
kind = "deliverable"
statement = "ConventionalCommit.String() rebuilds the subject, keeping scope and !, so parsing a well-formed subject and calling String returns it unchanged; ConventionalCommit.PrefixLen() is the length of everything before Description"
verify = "test/ module: round trip of feat(api)!: x and fix: y"

[[item]]
id = "P8"
kind = "deliverable"
statement = "ParseConventionalCommitType, ComposeConventionalCommitSubject and ConventionalCommitPrefixLen are gone; ConventionalCommitTypeNames remains"

[[item]]
id = "P9"
kind = "deliverable"
statement = "ConventionalCommitSignal and every conventional-commit function read subjects through ParseConventionalCommit; no other code in go-gitutil parses a conventional-commit subject"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Repo.Ignored(ctx, []dt.RelDirPath) ([]dt.RelDirPath, error) returns the subset of paths git ignores, from one git check-ignore --stdin -z process however many paths are given"
verify = "test/ module: a .gitignore with a dir-only pattern (build/) and a nested pattern; ignored and kept paths in one call"

[[item]]
id = "P11"
kind = "deliverable"
statement = "Repo.Ignored passes each directory with a trailing slash, so directory-only patterns match, and returns an empty result with no error when nothing is ignored"

[[item]]
id = "P12"
kind = "deliverable"
statement = "go-gitutil has no FindNestedModules"
verify = "go doc . FindNestedModules fails"

[[item]]
id = "P13"
kind = "deliverable"
statement = "AddArgs.Force's doc comment says Force adds ignored files, and no longer says it is what makes a nested repository a gitlink"

[[item]]
id = "P14"
kind = "deliverable"
statement = "golangci-lint v2.15.0 reports nothing on the root and test modules, and every go.mod says go 1.27.0"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not change gomion; the editor's move to ParseConventionalCommit and the CommitSignals-to-FindingType mapping are E-2601"

[[item]]
id = "P16"
kind = "exclusion"
statement = "Does not suppress git's embedded-repository advice; Add never streams, so the advice reaches no one"

[[item]]
id = "P17"
kind = "exclusion"
statement = "Does not move go-gitutil's tests onto go-fsfix fixtures, which is E-2602"

[[item]]
id = "P18"
kind = "exclusion"
statement = "Does not tag or release; E-2529 prepares the first release"
